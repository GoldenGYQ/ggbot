[project]
name = "ggbot"
version = "0.1.0"
description = "GGBot - a minimal Claude-Code-inspired CLI agent (Python MVP)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "litellm>=1.40",
  "typer>=0.12",
  "textual>=0.70",
  "readability-lxml>=0.8.1",
  "ddgs>=6.1.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
ggbot = "ggbot.cli:app"
bot = "ggbot.cli:app"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ggbot"]
