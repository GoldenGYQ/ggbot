<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GGbot 智能助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { primary: '#165DFF' } } }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    .dark ::-webkit-scrollbar-thumb { background: #444; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 transition-colors h-screen flex flex-col">
  <div class="flex flex-1 overflow-hidden">
    <!-- 左侧会话栏 -->
    <div id="sidebar" class="w-64 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col hidden md:flex">
      <div class="p-4 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center">
        <h1 class="font-bold text-lg">GGbot 助手</h1>
        <button id="new-chat" class="text-primary"><i class="fa fa-plus"></i></button>
      </div>
      <div id="sessions-list" class="flex-1 overflow-y-auto p-2 space-y-1">
        <div class="text-sm text-gray-500 p-2">暂无会话</div>
      </div>
      <div class="p-3 border-t border-gray-200 dark:border-gray-800 space-y-2">
        <button id="theme-btn" class="w-full p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-800 text-sm flex items-center gap-2">
          <i class="fa fa-moon-o"></i> 切换暗色
        </button>
        <div class="text-xs text-gray-400 text-center">API: 127.0.0.1:8000</div>
      </div>
    </div>

    <!-- 主聊天区域 -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
      <div class="p-3 border-b border-gray-200 dark:border-gray-800 flex md:hidden justify-between items-center">
        <button id="mobile-menu" class="p-2"><i class="fa fa-bars"></i></button>
        <h1 class="font-bold">GGbot 助手</h1>
        <button id="mobile-new" class="p-2 text-primary"><i class="fa fa-plus"></i></button>
      </div>

      <div id="messages" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
        <div class="flex flex-col items-center justify-center h-full text-gray-400 text-center space-y-2">
          <i class="fa fa-robot text-4xl"></i>
          <p>开始与 GGbot 对话吧</p>
        </div>
      </div>

      <!-- 输入框 -->
      <div class="p-4 border-t border-gray-200 dark:border-gray-800">
        <div class="max-w-3xl mx-auto relative">
          <textarea id="input" rows="1" placeholder="输入消息..." class="w-full border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 rounded-lg p-3 pr-12 resize-none outline-none focus:border-primary"></textarea>
          <button id="send" class="absolute right-3 bottom-3 text-primary"><i class="fa fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const apiBase = "http://127.0.0.1:8000";
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const sessionsListEl = document.getElementById("sessions-list");
    const newChatBtn = document.getElementById("new-chat");
    const mobileNewBtn = document.getElementById("mobile-new");
    const themeBtn = document.getElementById("theme-btn");
    const mobileMenuBtn = document.getElementById("mobile-menu");
    const sidebarEl = document.getElementById("sidebar");

    let currentSessionId = null;

    // 暗色模式
    if (localStorage.getItem("dark") === "true") document.documentElement.classList.add("dark");
    themeBtn.addEventListener("click", () => {
      document.documentElement.classList.toggle("dark");
      localStorage.setItem("dark", document.documentElement.classList.contains("dark"));
    });

    // 移动端菜单
    mobileMenuBtn.addEventListener("click", () => {
      sidebarEl.classList.toggle("hidden");
    });

    // 清空消息
    function clearMessages() {
      messagesEl.innerHTML = `
        <div class="flex flex-col items-center justify-center h-full text-gray-400 text-center space-y-2">
          <i class="fa fa-robot text-4xl"></i>
          <p>开始与 GGbot 对话吧</p>
        </div>
      `;
    }

    // 新增会话
    async function createSession() {
      try {
        const res = await fetch(`${apiBase}/api/v1/sessions`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: "chat", title: "新会话" })
        });
        const data = await res.json();
        currentSessionId = data.id;
        clearMessages();
        loadSessions();
      } catch (e) {
        alert("连接 API 失败，请确保 GGbot 已启动");
      }
    }

    newChatBtn.addEventListener("click", createSession);
    mobileNewBtn.addEventListener("click", createSession);

    // 加载会话列表
    async function loadSessions() {
      try {
        const res = await fetch(`${apiBase}/api/v1/sessions`);
        const data = await res.json();
        sessionsListEl.innerHTML = "";
        if (!data.sessions.length) {
          sessionsListEl.innerHTML = `<div class="text-sm text-gray-500 p-2">暂无会话</div>`;
          return;
        }
        data.sessions.forEach(s => {
          const div = document.createElement("div");
          div.className = `p-2 rounded text-sm cursor-pointer ${s.id === currentSessionId ? 'bg-primary/10 text-primary' : 'hover:bg-gray-100 dark:hover:bg-gray-800'}`;
          div.textContent = s.title || "未命名会话";
          div.addEventListener("click", () => {
            currentSessionId = s.id;
            loadSessionMessages(s.id);
            loadSessions();
          });
          sessionsListEl.appendChild(div);
        });
      } catch (e) {}
    }

    // 加载会话消息
    async function loadSessionMessages(id) {
      try {
        const res = await fetch(`${apiBase}/api/v1/sessions/${id}`);
        const data = await res.json();
        messagesEl.innerHTML = "";
        data.messages.forEach(msg => {
          addMessage(msg.role, msg.content);
        });
      } catch (e) {}
    }

    // 添加消息到界面
    function addMessage(role, content) {
      if (messagesEl.querySelector(".text-gray-400")) messagesEl.innerHTML = "";
      const div = document.createElement("div");
      div.className = role === "user" 
        ? "flex justify-end" 
        : "flex justify-start";
      
      const bubble = document.createElement("div");
      bubble.className = role === "user"
        ? "bg-primary text-white rounded-lg px-4 py-2 max-w-[85%]"
        : "bg-gray-200 dark:bg-gray-800 rounded-lg px-4 py-2 max-w-[85%] whitespace-pre-wrap";
      
      bubble.textContent = content;
      div.appendChild(bubble);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // 流式发送消息
    async function sendMessage(content) {
      if (!currentSessionId) await createSession();
      addMessage("user", content);
      inputEl.value = "";

      const botDiv = document.createElement("div");
      botDiv.className = "flex justify-start";
      const botBubble = document.createElement("div");
      botBubble.className = "bg-gray-200 dark:bg-gray-800 rounded-lg px-4 py-2 max-w-[85%] whitespace-pre-wrap";
      botBubble.textContent = "";
      botDiv.appendChild(botBubble);
      messagesEl.appendChild(botDiv);

      try {
        const resp = await fetch(`${apiBase}/api/v1/messages`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content, session_id: currentSessionId, stream: true })
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        let fullText = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop() || "";

          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const data = JSON.parse(line);

              if (data.type === "event") {
                const eventType = data.event_type;
                const eventData = data.data || {};

                switch (eventType) {
                  case "assistant_delta":
                    // 助手增量输出
                    fullText += eventData.delta || "";
                    botBubble.textContent = fullText;
                    break;

                  case "tool_call":
                    // 工具调用 - 显示工具调用信息
                    const toolName = eventData.name || "unknown";
                    const toolArgs = JSON.stringify(eventData.arguments || {}, null, 2);
                    fullText += `\n\n🔧 **调用工具**: ${toolName}\n`;
                    if (toolArgs !== "{}") {
                      fullText += `参数: ${toolArgs}\n`;
                    }
                    botBubble.textContent = fullText;
                    break;

                  case "tool_result":
                    // 工具执行结果 - 显示工具输出
                    const resultName = eventData.name || "unknown";
                    const resultContent = eventData.content || "";
                    const isError = eventData.error === true;

                    if (resultContent.trim()) {
                      fullText += `\n${isError ? "❌" : "✅"} **工具结果** (${resultName}):\n`;
                      fullText += resultContent + "\n";
                      botBubble.textContent = fullText;
                    }
                    break;

                  case "status":
                    // 状态更新 - 显示状态信息
                    const statusMsg = eventData.message || "";
                    const severity = eventData.severity || "info";
                    if (statusMsg.trim()) {
                      let emoji = "ℹ️";
                      if (severity === "warning") emoji = "⚠️";
                      if (severity === "error") emoji = "❌";

                      fullText += `\n${emoji} **状态**: ${statusMsg}\n`;
                      botBubble.textContent = fullText;
                    }
                    break;

                  case "thinking":
                    // 思考过程 - 可选显示
                    const thinking = eventData.thinking || "";
                    if (thinking.trim()) {
                      fullText += `\n💭 **思考**: ${thinking}\n`;
                      botBubble.textContent = fullText;
                    }
                    break;

                  case "turn_update":
                    // 轮次更新 - 显示当前轮次
                    const currentTurn = eventData.current_turn || 0;
                    const maxTurns = eventData.max_turns || 8;
                    fullText += `\n🔄 **轮次**: ${currentTurn}/${maxTurns}\n`;
                    botBubble.textContent = fullText;
                    break;
                }

                messagesEl.scrollTop = messagesEl.scrollHeight;
              }
            } catch (e) {
              console.error("解析事件失败:", e, "行:", line);
            }
          }
        }
      } catch (e) {
        botBubble.textContent = "❌ 连接 GGbot API 失败，请检查服务是否启动";
      }
      loadSessions();
    }

    // 发送按钮 & 回车
    sendBtn.addEventListener("click", () => {
      const val = inputEl.value.trim();
      if (val) sendMessage(val);
    });
    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        const val = inputEl.value.trim();
        if (val) sendMessage(val);
      }
    });

    // 初始化
    loadSessions();
  </script>
</body>
</html>
