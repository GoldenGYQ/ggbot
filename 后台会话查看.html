<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>后台会话查看</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --panel: #171a21;
      --text: #e6e8ee;
      --muted: #9aa4b2;
      --border: #2a3140;
      --in: #1b2333;
      --out: #1f2b1f;
      --btn: #2f6feb;
      --btn-text: #ffffff;
    }
    body {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr 220px 140px 100px;
      gap: 8px;
      margin-bottom: 12px;
    }
    input, select, button {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 10px;
      font: inherit;
    }
    button {
      background: var(--btn);
      color: var(--btn-text);
      cursor: pointer;
    }
    .meta {
      margin: 6px 0 12px;
      color: var(--muted);
      font-size: 12px;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .panel-title {
      margin: 10px 0 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .item {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .item.in { background: var(--in); }
    .item.out { background: var(--out); }
    .head {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
    }
    pre {
      margin: 0;
      padding: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>后台会话查看（原始 Model I/O）</h2>
    <div class="toolbar">
      <input id="baseUrl" value="http://127.0.0.1:8000" placeholder="API Base URL" />
      <select id="sessionSelect"></select>
      <button id="reloadBtn">刷新</button>
      <button id="autoBtn">自动:关</button>
    </div>
    <div class="meta" id="meta">未加载</div>
    <div class="split">
      <div>
        <div class="panel-title">Transcript: model_message 原文</div>
        <div class="list" id="list"></div>
      </div>
      <div>
        <div class="panel-title">WS: provider_chunk 原始流</div>
        <div class="list" id="wsList"></div>
      </div>
    </div>
  </div>

  <script>
    const baseUrlEl = document.getElementById("baseUrl");
    const sessionSelectEl = document.getElementById("sessionSelect");
    const reloadBtn = document.getElementById("reloadBtn");
    const autoBtn = document.getElementById("autoBtn");
    const metaEl = document.getElementById("meta");
    const listEl = document.getElementById("list");
    const wsListEl = document.getElementById("wsList");

    let autoTimer = null;
    let ws = null;
    let wsSeq = 0;

    function fmtTime(tsMs) {
      if (!tsMs) return "-";
      const d = new Date(tsMs);
      return d.toLocaleString();
    }

    function safeJson(value) {
      try {
        return JSON.stringify(value, null, 2);
      } catch {
        return String(value);
      }
    }

    async function loadSessions() {
      const base = baseUrlEl.value.trim().replace(/\/+$/, "");
      const res = await fetch(`${base}/api/v1/sessions`);
      if (!res.ok) throw new Error(`加载会话失败: HTTP ${res.status}`);
      const data = await res.json();
      const sessions = Array.isArray(data.sessions) ? data.sessions : [];

      sessionSelectEl.innerHTML = "";
      for (const s of sessions) {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = `${s.title || "Untitled"} (${s.id})`;
        sessionSelectEl.appendChild(opt);
      }
      if (data.current_session_id) {
        sessionSelectEl.value = data.current_session_id;
      }
      if (!sessionSelectEl.value && sessions.length > 0) {
        sessionSelectEl.value = sessions[0].id;
      }
    }

    async function loadModelIO() {
      const sessionId = sessionSelectEl.value;
      if (!sessionId) {
        metaEl.textContent = "无会话可选";
        listEl.innerHTML = "";
        return;
      }
      const base = baseUrlEl.value.trim().replace(/\/+$/, "");
      const res = await fetch(`${base}/api/v1/sessions/${encodeURIComponent(sessionId)}/model-io`);
      if (!res.ok) throw new Error(`加载 model-io 失败: HTTP ${res.status}`);
      const data = await res.json();
      const items = Array.isArray(data.items) ? data.items : [];

      metaEl.textContent = `session_id=${data.session_id} | 条目=${data.count} | 更新时间=${new Date().toLocaleTimeString()}`;
      listEl.innerHTML = "";
      for (const it of items) {
        const div = document.createElement("div");
        div.className = `item ${it.direction === "output" ? "out" : "in"}`;
        const head = document.createElement("div");
        head.className = "head";
        head.innerHTML = `<span>${it.direction} | role=${it.role}</span><span>${fmtTime(it.ts_ms)}</span>`;
        const pre = document.createElement("pre");
        pre.textContent = safeJson(it.data);
        div.appendChild(head);
        div.appendChild(pre);
        listEl.appendChild(div);
      }
    }

    function wsUrlFromBase(base) {
      const u = base.trim().replace(/\/+$/, "");
      if (u.startsWith("https://")) return `${u.replace("https://", "wss://")}/ws`;
      if (u.startsWith("http://")) return `${u.replace("http://", "ws://")}/ws`;
      return `${u}/ws`;
    }

    function pushWsChunk(eventData) {
      const sessionId = sessionSelectEl.value;
      const data = eventData?.data || {};
      if (!sessionId || data.session_id !== sessionId) return;
      if (eventData.event_type !== "provider_chunk") return;
      const chunk = data.chunk;
      const div = document.createElement("div");
      div.className = "item out";
      const head = document.createElement("div");
      head.className = "head";
      head.innerHTML = `<span>#${++wsSeq} | provider_chunk</span><span>${new Date().toLocaleTimeString()}</span>`;
      const pre = document.createElement("pre");
      pre.textContent = safeJson(chunk);
      div.appendChild(head);
      div.appendChild(pre);
      wsListEl.prepend(div);
      while (wsListEl.children.length > 120) {
        wsListEl.removeChild(wsListEl.lastChild);
      }
    }

    function connectWs() {
      const url = wsUrlFromBase(baseUrlEl.value);
      if (ws) {
        try { ws.close(); } catch {}
      }
      ws = new WebSocket(url);
      ws.onopen = () => {
        metaEl.textContent = `${metaEl.textContent} | WS已连接`;
      };
      ws.onmessage = (evt) => {
        try {
          const obj = JSON.parse(evt.data);
          if (obj && obj.type === "event") {
            pushWsChunk(obj);
          }
        } catch {}
      };
      ws.onclose = () => {
        metaEl.textContent = `${metaEl.textContent} | WS已断开`;
        setTimeout(connectWs, 1200);
      };
    }

    async function reloadAll() {
      try {
        await loadSessions();
        await loadModelIO();
      } catch (e) {
        metaEl.textContent = `错误: ${String(e)}`;
      }
    }

    function toggleAuto() {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        autoBtn.textContent = "自动:关";
        return;
      }
      autoTimer = setInterval(() => {
        loadModelIO().catch((e) => {
          metaEl.textContent = `自动刷新失败: ${String(e)}`;
        });
      }, 2000);
      autoBtn.textContent = "自动:开";
    }

    reloadBtn.addEventListener("click", reloadAll);
    baseUrlEl.addEventListener("change", () => {
      connectWs();
      reloadAll();
    });
    autoBtn.addEventListener("click", toggleAuto);
    sessionSelectEl.addEventListener("change", () => {
      wsListEl.innerHTML = "";
      wsSeq = 0;
      loadModelIO().catch((e) => {
        metaEl.textContent = `切换会话失败: ${String(e)}`;
      });
    });

    connectWs();
    reloadAll();
  </script>
</body>
</html>
